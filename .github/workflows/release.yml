# 打 tag 发版: git tag v0.x.y && git push origin v0.x.y
# 产物: relay(Windows 托盘版, 含 scrcpy-server 的 zip) / hub(linux+windows) / viewer APK
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build relay (Windows tray)
        working-directory: relay
        env: { GOOS: windows, GOARCH: amd64 }
        run: go build -trimpath -ldflags "-H=windowsgui -s -w" -o ../dist/phonecast-relay.exe .

      - name: Build hub (linux + windows)
        working-directory: hub
        run: |
          GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/phonecast-hub-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/phonecast-hub.exe .

      - name: Package relay bundle (exe + scrcpy-server)
        run: |
          mkdir -p bundle
          cp dist/phonecast-relay.exe relay/scrcpy-server-v2.7 bundle/
          cd bundle && zip -r ../dist/phonecast-relay-windows.zip .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 签名必须每次一致, 否则应用内更新会因签名不符而拒绝安装。
      # keystore 以 base64 存在仓库 Secrets 里 (SIGNING_KEYSTORE_B64), 不入库。
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -u
          KEY_PATH="$GITHUB_WORKSPACE/viewer/release.jks"
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::未配置 SIGNING_KEYSTORE_B64, 将产出 debug 签名包(无法覆盖升级正式版)"
            exit 0
          fi
          # 从 Windows 复制粘贴常会带进 \r 或换行, base64 -d 会因此报错
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n \t' | base64 -d > "$KEY_PATH" || {
            echo "::error::SIGNING_KEYSTORE_B64 不是合法的 base64, 请重新复制(整行, 无空格换行)"
            exit 1
          }
          SIZE=$(stat -c%s "$KEY_PATH")
          echo "keystore 已还原, ${SIZE} 字节"
          [ "$SIZE" -gt 0 ] || { echo "::error::还原出来是空文件"; exit 1; }
          # 用口令试开一次, 口令错的话在这里就能说清楚, 不必等到签名步骤
          if ! keytool -list -keystore "$KEY_PATH" -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::keystore 打不开: SIGNING_STORE_PASSWORD 不对, 或 base64 内容不完整"
            exit 1
          fi
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Build viewer APK
        working-directory: viewer
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/viewer/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/phonecast-viewer-release.apk ../dist/phonecast-viewer.apk
          else
            ./gradlew :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/phonecast-viewer-debug.apk ../dist/phonecast-viewer.apk
          fi

      - name: Clean up signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/viewer/release.jks"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/phonecast-relay-windows.zip
            dist/phonecast-hub-linux-amd64
            dist/phonecast-hub.exe
            dist/phonecast-viewer.apk
